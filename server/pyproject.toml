[project]
name = "env-monitor-server"
version = "0.1.0"
description = "Flask API and dashboard for the env-monitor ESP32 station"
authors = [
    { name = "Ivan Jankovic" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
